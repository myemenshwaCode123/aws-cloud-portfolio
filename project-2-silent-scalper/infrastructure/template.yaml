AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Silent Scalper - Serverless Data Processing Pipeline (Project 2)

Parameters:
  InitialsSuffix:
    Type: String
    Description: Your initials, used for globally-unique bucket names
  AlertEmail:
    Type: String

Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 256
    Tracing: Active

Resources:

  InputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "silent-scalper-input-${InitialsSuffix}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  QuarantineBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "silent-scalper-quarantine-${InitialsSuffix}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ProcessedFilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ProcessedFiles
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: file_id
          AttributeType: S
        - AttributeName: processed_at
          AttributeType: S
      KeySchema:
        - AttributeName: file_id
          KeyType: HASH
        - AttributeName: processed_at
          KeyType: RANGE

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: silent-scalper-alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  SilentScalperApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'GET,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  ProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: silent-scalper-processor
      CodeUri: ../lambda/
      Handler: processor.lambda_handler
      Environment:
        Variables:
          TABLE_NAME: !Ref ProcessedFilesTable
          QUARANTINE_BUCKET: !Ref QuarantineBucket
          SNS_TOPIC_ARN: !Ref AlertTopic
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub "silent-scalper-input-${InitialsSuffix}"
        - S3CrudPolicy:
            BucketName: !Ref QuarantineBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref ProcessedFilesTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertTopic.TopicName
        - CloudWatchPutMetricPolicy: {}
      Events:
        S3Upload:
          Type: S3
          Properties:
            Bucket: !Ref InputBucket
            Events: s3:ObjectCreated:*

  QueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: silent-scalper-query
      CodeUri: ../lambda/
      Handler: query.lambda_handler
      Environment:
        Variables:
          TABLE_NAME: !Ref ProcessedFilesTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ProcessedFilesTable
      Events:
        GetFiles:
          Type: Api
          Properties:
            RestApiId: !Ref SilentScalperApi
            Path: /files
            Method: GET

  FailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: Silent-Scalper-Failure-Alert
      Namespace: SilentScalper
      MetricName: ProcessingFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlertTopic

Outputs:
  ApiUrl:
    Value: !Sub "https://${SilentScalperApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/files"
  InputBucketName:
    Value: !Ref InputBucket
  QuarantineBucketName:
    Value: !Ref QuarantineBucket
